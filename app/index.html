<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScheduleSnap</title>
    <link rel="stylesheet" href="/css/app/main.css" />
    <script src="/js/app/nav.js" defer></script>
    <script type="module" src="/js/app/dashboard.js"></script>
    <link rel="icon" href="/assets/logos/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/logos/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/logos/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="/assets/logos/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/logos/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header></header>
    <main class="dashboard-main">
      <h1>ScheduleSnap</h1>

      <section class="dashboard-section" id="join-section">
        <h2>Join an event</h2>
        <p>Enter the 8-digit event code from your organizer.</p>
        <form id="join-form" class="dashboard-card">
          <label for="join-code-input">Event code</label>
          <input
            id="join-code-input"
            name="code"
            inputmode="numeric"
            maxlength="11"
            autocomplete="off"
          />
          <button type="submit" class="button button-primary">Continue</button>
        </form>
      </section>

      <section class="dashboard-section" id="organizer-section">
        <h2>Your events</h2>
        <p>Events you organize on this device.</p>
        <ul id="organizer-events-list" class="dashboard-list"></ul>
        <p id="organizer-empty" class="dashboard-empty" hidden>No events yet.</p>
        <form id="add-organizer-form" class="dashboard-card">
          <label for="organizer-secret-input">Add with organizer secret</label>
          <input
            id="organizer-secret-input"
            name="token"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" class="button button-secondary">Add event</button>
        </form>
        <p>
          <a href="/app/create/" class="button button-primary">Create new event</a>
        </p>
      </section>

      <section class="dashboard-section" id="responses-section">
        <h2>Your responses</h2>
        <p>Events you have responded to on this device.</p>
        <ul id="my-responses-list" class="dashboard-list"></ul>
        <p id="responses-empty" class="dashboard-empty" hidden>No responses yet.</p>
      </section>

      <p id="dashboard-status" class="dashboard-status" hidden></p>
    </main>
  </body>
</html>
