<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Results | ScheduleSnap</title>
    <link rel="stylesheet" href="/css/app/main.css" />
    <script src="/js/app/nav.js" defer></script>
    <script type="module" src="/js/app/view-event.js"></script>
    <link rel="icon" href="/assets/logos/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/logos/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/assets/logos/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/logos/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header></header>
    <main>
      <form id="event-code-form">
        <label for="event-code-input">Event code</label>
        <input
          id="event-code-input"
          name="code"
          inputmode="numeric"
          maxlength="11"
          autocomplete="off"
        />
        <button type="submit" class="button button-primary">View results</button>
      </form>
      <form id="organizer-token-form">
        <label for="organizer-token-input">Organizer secret</label>
        <input
          id="organizer-token-input"
          name="token"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" class="button button-primary">View as organizer</button>
      </form>
      <p id="view-status" hidden></p>
      <article id="view-article" hidden>
        <h1 id="event-title"></h1>
        <h2>Recommendations</h2>
        <ul id="recommendations-list"></ul>
        <h2>Responses</h2>
        <ul id="responses-list"></ul>
      </article>
    </main>
  </body>
</html>
