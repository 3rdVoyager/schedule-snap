<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Results | ScheduleSnap</title>
    <link rel="stylesheet" href="/css/app/main.css" />
    <script src="/js/app/nav.js" defer></script>
    <script type="module" src="/js/app/view.js"></script>
    <link rel="icon" href="/assets/logos/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/logos/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/assets/logos/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/logos/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header></header>
    <main class="dashboard-main view-page">
      <p id="view-status" class="manage-status" hidden></p>
      <article id="view-article" class="view-page" hidden>
        <header class="dashboard-page-header">
          <div>
            <h1 id="event-title"></h1>
            <p class="dashboard-lead">Recommended times and who responded.</p>
          </div>
        </header>

        <section class="dashboard-section">
          <h2>Recommendations</h2>
          <p id="recommendations-empty" class="dashboard-empty-state" hidden>
            No overlapping times yet. Add more responses to see recommendations.
          </p>
          <ul id="recommendations-list" class="dashboard-list view-list"></ul>
        </section>

        <section class="dashboard-section">
          <h2>Responses</h2>
          <p id="responses-empty" class="dashboard-empty-state" hidden>
            No responses yet.
          </p>
          <ul id="responses-list" class="dashboard-list view-list"></ul>
        </section>

        <p class="manage-actions">
          <a href="/app/" class="button button-primary-outline">Back to dashboard</a>
        </p>
      </article>
    </main>
  </body>
</html>
