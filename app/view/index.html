<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Results | ScheduleSnap</title>
    <link rel="stylesheet" href="/css/app/main.css" />
    <script src="/js/app/nav.js" defer></script>
    <script type="module" src="/js/app/view.js"></script>
    <link rel="icon" href="/assets/logos/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/logos/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/assets/logos/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/logos/site.webmanifest" />
  </head>
  <body>
    <header></header>
    <main class="app-main app-page">
      <article id="view-article" class="app-page" hidden>
        <header class="card card-hero card-header">
          <div class="page-header" id="page-header">
            <h1 id="event-title"></h1>
            <p class="text-muted" id="event-description" hidden></p>
            <p class="text-sub" id="event-meta"></p>
            <ul class="page-header-windows" id="event-windows"></ul>
            <p class="text-muted" id="page-lead">Recommended times and who responded.</p>
          </div>
        </header>

        <section class="card card-normal section">
          <h2>Recommendations</h2>
          <p id="recommendations-empty" class="empty-state text-sub text-center" hidden>
            No overlapping times yet. Add more responses to see recommendations.
          </p>
          <ul id="recommendations-list" class="app-list app-list--bordered"></ul>
        </section>

        <section class="card card-normal section">
          <h2>Responses</h2>
          <p id="responses-empty" class="empty-state text-sub text-center" hidden>
            No responses yet.
          </p>
          <ul id="responses-list" class="app-list app-list--bordered"></ul>
          <div id="response-viewer" class="response-viewer" hidden>
            <h3 id="response-viewer-name"></h3>
            <div id="response-viewer-calendar"></div>
          </div>
        </section>

        <p class="page-actions">
          <a href="/app/" class="button button-primary-outline">Back to dashboard</a>
        </p>
      </article>
    </main>
  </body>
</html>
